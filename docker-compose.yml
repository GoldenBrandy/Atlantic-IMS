services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: grupo3
      POSTGRES_PASSWORD: "1234567"
      POSTGRES_DB: atlantic_ims_grupo3
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    env_file:
      - ./backend/.env
    depends_on:
      - postgres
    ports:
      - "9003:4000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: https://grupo3.ricoprogramar.com/api
    depends_on:
      - backend
    ports:
      - "8003:80"

volumes:
  postgres_data:
