services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: grupo3
      POSTGRES_PASSWORD: "1234567"
      POSTGRES_DB: atlantic_ims_grupo3
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grupo3 -d atlantic_ims_grupo3"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build: ./backend
    env_file:
      - ./backend/.env
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "9003:4000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: https://grupo3.ricoprogramar.com/api
    depends_on:
      - backend
    ports:
      - "8003:80"
    restart: unless-stopped

volumes:
  postgres_data:
