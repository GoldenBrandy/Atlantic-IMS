server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Las rutas de React Router (ej. /auth/forgot-password) no existen como
    # archivos reales: si nginx no encuentra el archivo/carpeta pedido, sirve
    # index.html igual y React se encarga de mostrar la ruta correcta.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # El documento HTML nunca se debe guardar en la cache del navegador: si
    # se guardara, al cerrar sesion y presionar "atras" el navegador podria
    # mostrar una version ya autenticada sin volver a pedirla al servidor.
    # Los archivos con hash (JS/CSS en /assets) no pasan por aqui y siguen
    # con la cache normal de nginx.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }
}
